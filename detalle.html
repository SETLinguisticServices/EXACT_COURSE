<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalles de la Sesión</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --exaver-blue: #2B6CB0; --dark-text: #2d3748; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', sans-serif; }
        body { background: #f3f7fa; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 1.5rem; }
        
        .detail-box { background: #ffffff; padding: 3rem; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); max-width: 650px; width: 100%; }
        .badge { background-color: #E2E8F0; color: var(--dark-text); padding: 0.3rem 1rem; border-radius: 20px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; display: inline-block; margin-bottom: 1rem; }
        h1 { color: #0F2C59; font-size: 1.8rem; font-weight: 800; margin-bottom: 1rem; }
        .divider { height: 3px; background: #00A859; width: 60px; margin-bottom: 1.5rem; }
        .info-block { margin-bottom: 1.5rem; color: var(--dark-text); }
        .info-block h4 { color: var(--exaver-blue); margin-bottom: 0.4rem; font-size: 1.1rem; }
        .info-block p { color: #4A5568; line-height: 1.6; }
        .info-block ul { padding-left: 1.2rem; color: #4A5568; line-height: 1.6; }
        .info-block li { margin-bottom: 0.4rem; }
        
        .btn-close { display: inline-block; background-color: #4A5568; color: #ffffff; padding: 0.8rem 2rem; border-radius: 6px; font-weight: 600; border: none; cursor: pointer; margin-top: 1rem; }
    </style>
</head>
<body>

    <div class="detail-box">
        <span id="det-modulo" class="badge">Módulo</span>
        <h1 id="det-titulo">Cargando Sesión...</h1>
        <div class="divider"></div>
        <div class="info-block">
            <h4>🎯 Enfoque Principal:</h4>
            <p id="det-foco"></p>
        </div>
        <div class="info-block">
            <h4>🚀 Objetivos Estratégicos:</h4>
            <ul id="det-objetivos"></ul>
        </div>
        <button onclick="window.close()" class="btn-close">Cerrar esta Ventana</button>
    </div>

    <script>
        const datosSesiones = {
            "1_2": { mod: "Reading & Writing", t: "Sesiones 01 / 02", f: "Comprensión global de avisos y señalizaciones.", o: ["Identificar intenciones comunicativas en textos cortos.", "Aprender mecánicas de descarte lógico de distractores semánticos."] },
            "3_4": { mod: "Reading & Writing", t: "Sesiones 03 / 04", f: "Reforzamiento de emparejamiento de textos complejos.", o: ["Escanear información bajo presión de tiempo coordinado.", "Cruzar restricciones léxicas en perfiles múltiples."] },
            "5_6": { mod: "Reading & Writing", t: "Sesiones 05 / 06", f: "Procesamiento de Cloze estructural y gramatical.", o: ["Analizar la cohesión mediante conectores y pronombres de referencia.", "Evaluar contextos gramaticales anteriores y posteriores."] },
            "7_8": { mod: "Reading & Writing", t: "Sesiones 07 / 08", f: "Comprensión detallada de opiniones y textos extensos.", o: ["Discernir de manera puntual entre datos factuales y opiniones implícitas.", "Mapear líneas de evidencia textual directa."] },
            "9_10": { mod: "Reading & Writing", t: "Sesiones 09 / 10", f: "Producción de textos escritos estructurados.", o: ["Aplicar rúbricas de cumplimiento de tarea y rango léxico.", "Desarrollar plantillas de redacción formal e informal."] },
            "11": { mod: "Listening", t: "Sesión 11", f: "Identificación de datos específicos en monólogos cortos.", o: ["Monitorear distractores auditivos recurrentes.", "Retener información numérica y de localización precisa."] },
            "12": { mod: "Listening", t: "Sesión 12", f: "Reforzamiento de completado de notas y dictados.", o: ["Predecir categorías gramaticales antes de las reproducciones.", "Asegurar ortografía precisa bajo velocidad de examen."] },
            "13": { mod: "Listening", t: "Sesión 13", f: "Identificación de posturas en múltiples hablantes.", o: ["Interpretar estados de ánimo y lenguaje idiomático.", "Discernir intenciones abstractas más allá de palabras literales."] },
            "14": { mod: "Listening", t: "Sesión 14", f: "Seguimiento de narrativas y diálogos extensos.", o: ["Mantener concentración sostenida en audios de larga duración.", "Detectar cambios discursivos clave para avanzar preguntas."] },
            "15": { mod: "Speaking", t: "Sesión 15", f: "Entrevista personal e interacción social directa.", o: ["Expandir respuestas cortas de manera natural.", "Estructurar respuestas combinando justificación y anécdotas."] },
            "16": { mod: "Speaking", t: "Sesión 16", f: "Reforzamiento de tareas colaborativas en parejas.", o: ["Manejar turnos de habla y estrategias de negociación fluida.", "Establecer diálogos de balance mutuo en la distribución de tiempo."] },
            "17": { mod: "Speaking", t: "Sesión 17", f: "Desarrollo del turno monologal extendido.", o: ["Organizar descripciones visuales mediante conectores de espacio.", "Aplicar técnicas de circunloquio ante vacíos de vocabulario."] },
            "18": { mod: "Speaking", t: "Sesión 18", f: "Práctica general con evaluaciones formativas de Speaking.", o: ["Simular tiempos y dinámicas de interacción bajo rúbrica real.", "Co-evaluar el desempeño oral usando listas de verificación objetivas."] },
            "19_20": { mod: "Final Evaluation", t: "Sesiones 19 / 20", f: "Simulacro real integrado (1.5 horas) y cierre estratégico con retroalimentación.", o: ["Administrar los tiempos de resolución y vaciado de respuestas en bloques reales.", "Recibir diagnósticos de error para prevención sistemática final."] }
        };

        const params = new URLSearchParams(window.location.search);
        const sesionId = params.get('sesion');

        if (sesionId && datosSesiones[sesionId]) {
            const data = datosSesiones[sesionId];
            document.getElementById('det-modulo').innerText = data.mod;
            document.getElementById('det-titulo').innerText = data.t;
            document.getElementById('det-foco').innerText = data.f;
            
            let htmlObj = "";
            data.o.forEach(obj => { htmlObj += `<li>${obj}</li>`; });
            document.getElementById('det-objetivos').innerHTML = htmlObj;
            document.title = "Detalles - " + data.t;
        }
    </script>
</body>
</html>
